<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New contact request</title>
  </head>
  <body style="margin:0;padding:0;background:#f4f7fb;color:#1f2937;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f7fb;padding:28px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:640px;background:#ffffff;border:1px solid #d8dee8;border-radius:8px;overflow:hidden;">
            <tr>
              <td style="background:#183b56;color:#ffffff;padding:24px 28px;">
                <div style="font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#b9d3ea;">{{ contact_name }}</div>
                <h1 style="margin:8px 0 0;font-size:24px;line-height:1.3;">New contact request</h1>
              </td>
            </tr>
            <tr>
              <td style="padding:24px 28px;">
                <p style="margin:0 0 18px;font-size:15px;line-height:1.6;">A new contact request has been submitted by <strong>{{ name }}</strong>.</p>
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="border-collapse:collapse;">
                  {% for field in fields %}
                  <tr>
                    <th align="left" style="width:34%;padding:12px;border-top:1px solid #e5e9f0;background:#f8fafc;color:#526070;font-size:13px;">{{ field.Label }}</th>
                    <td style="padding:12px;border-top:1px solid #e5e9f0;font-size:14px;line-height:1.5;">{{ field.HTMLValue|safe }}</td>
                  </tr>
                  {% endfor %}
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:18px 28px;background:#f8fafc;border-top:1px solid #e5e9f0;color:#687587;font-size:12px;line-height:1.5;">
                Submitted at {{ submitted_at }}<br>
                <a href="{{ homepage_url }}" style="color:#2563eb;text-decoration:none;">{{ homepage_url }}</a>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
