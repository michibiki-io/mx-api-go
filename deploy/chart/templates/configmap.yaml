{{- $config := deepCopy .Values.config -}}
{{- if .Values.configFile.enabled -}}
{{- $_ := set $config "MX_API_CONFIG" .Values.configFile.mountPath -}}
{{- else -}}
{{- $_ := unset $config "MX_API_CONFIG" -}}
{{- end -}}
{{- if eq (default "" (get $config "DB_DSN")) "" -}}
{{- $_ := unset $config "DB_DSN" -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mx-api-go.configMapName" . }}
  labels:
    {{- include "mx-api-go.labels" . | nindent 4 }}
data:
  {{- range $key, $value := $config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- if .Values.configFile.enabled }}
  config.yaml: |
    {{- include "mx-api-go.renderConfigFile" . | nindent 4 }}
  {{- end }}
