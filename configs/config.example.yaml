server:
  context_path: "/contact"
  port: 8080

security:
  allowed_origins:
    - "www.example.com"
    - "localhost:5173"
    - "127.0.0.1:5173"
  rate_limit:
    enabled: true
    requests_per_minute: 60
    failure_requests_per_minute: 20
  idempotency:
    enabled: true
    ttl_seconds: 600

admin:
  dashboard:
    enabled: true
    base_path: "/admin"
    timestamp_format: "2006-01-02 15:04:05 MST"
    timestamp_timezone: "Asia/Tokyo"
  auth:
    mode: "header"
    user_header: "X-Forwarded-User"
    email_header: "X-Forwarded-Email"
    groups_header: "X-Forwarded-Groups"
    allowed_users: []
    allowed_groups:
      - "mx-api-admins"

audit:
  enabled: true
  storage:
    type: "sqlite"
    path: "/var/lib/mx-api/audit.db"
  retention_days: 90

smtp:
  server_addr: "smtp.example.com:465"
  authentication_enabled: true
  tls_mode: "implicit"

mail:
  from: "noreply@example.com"
  recipients:
    - "contact@example.com"
  subject: "We received an inquiry from a customer"
  template_path: "default_mail_template.html"
  contact_name: "Example Site"
  homepage_url: "https://www.example.com"
  timezone: "Asia/Tokyo"
  submitted_at_format: "2006-01-02 12:01:02 UTC"

form:
  fields:
    - name: "name"
      label: "Name"
      type: "text"
      required: true
      max_length: 255
      rules: ["required"]
    - name: "email"
      label: "Email"
      type: "email"
      required: true
      max_length: 320
      rules: ["required", "email"]
    - name: "tel"
      label: "Tel"
      type: "tel"
      max_length: 32
      rules: ["jp_phone"]
    - name: "organization"
      label: "Organization"
      type: "text"
      max_length: 255
    - name: "subject"
      label: "Subject"
      type: "text"
      required: true
      max_length: 200
      rules: ["required"]
    - name: "message"
      label: "Message"
      type: "textarea"
      required: true
      max_length: 4000
      rules: ["required", "message_length"]

validation:
  required:
    tag: "required"
    code: "validation_required"
    message: "cannot be blank"
  email:
    tag: "email"
    code: "validation_is_email"
    message: "must be a valid email address"
  jp_phone:
    tag: "jp_phone"
    code: "validation_is_phone_number"
    message: "must be a valid phone number in Japan"
  message_length:
    tag: "max=4000"
    code: "validation_max"
    message: "must be 4000 characters or less"
  plan:
    tag: "oneof=basic business enterprise"
    code: "validation_oneof"
    message: "must be one of the configured values"
